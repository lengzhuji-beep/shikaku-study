<meta charset="UTF-8">

<title>TOEIC® リスニング ブックマーク復習 | Shikakus</title>
<meta name="description" content="TOEIC® L&R リスニングセクションのブックマーク復習。保存した苦手問題を音声付きで復習できます。">

<style>
:root {
  --listening-accent: #345d4d;
  --listening-light: #eff6ff;
  --ok-color: #065f46;
  --ng-color: #991b1b;
}
.level-badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin: 16px 0 24px;
}
.level-pill-btn {
  background: #fff;
  border: 1.5px solid #cbd5e1;
  color: #334155;
  padding: 10px 14px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}
.level-pill-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  border-color: #e2e8f0;
}
.level-pill-btn.active {
  background: var(--listening-accent);
  border-color: var(--listening-accent);
  color: #fff;
}
.listen-choice-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid #e2e8f0;
  background: #f8fafc;
  border-radius: 8px;
  text-align: left;
  font-size: 1.02rem;
  font-weight: 500;
  cursor: pointer;
  margin-bottom: 8px;
  transition: all 0.15s ease;
  color: #1e293b;
  box-sizing: border-box;
}
.listen-choice-btn:hover:not(:disabled) {
  background: #eff6ff;
  border-color: #345d4d;
  transform: translateY(-1px);
}
.listen-choice-btn.correct {
  background: #ecfdf5 !important;
  border-color: #10b981 !important;
  color: #065f46 !important;
  font-weight: 700;
}
.listen-choice-btn.wrong {
  background: #fef2f2 !important;
  border-color: #ef4444 !important;
  color: #991b1b !important;
}
.listen-exp-box {
  margin-top: 14px;
  padding: 14px 16px;
  background: #f8fafc;
  border-radius: 8px;
  border-left: 4px solid var(--listening-accent);
}
.nav-btn {
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  font-size: 0.95rem;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.nav-btn-primary { background: var(--listening-accent); color: #fff; }
.nav-btn-primary:hover { background: #1e40af; }
.nav-btn-secondary { background: #e2e8f0; color: #334155; }
.nav-btn-secondary:hover { background: #cbd5e1; }
.quit-quiz-btn {
  background: #6c757d;
  color: #ffffff;
  padding: 6px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
  text-decoration: none;
}
.quit-quiz-btn:hover {
  background: #5a6268;
  color: #ffffff;
}
</style>
  <link rel="stylesheet" href="../../assets/css/kakutoku.css">
</head>
<body class="with-header">
  <!-- ヘッダー（資格ページ共通：トップのみ） -->
    <!-- ヘッダー（資格ページ共通：右側トップへ戻るのみ） -->
  <header class="kakutoku-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo-link">
        <div class="logo-mark">S</div>
        <span class="logo-text">Shikakus</span>
      </a>

      <div class="header-actions">
        <a href="../../index.html" class="btn-pill btn-pill-outline" style="padding: 0.55rem 1.25rem; font-size: 0.88rem;">トップへ戻る</a>
      </div>
    </div>
  </header>

<div class="container">
  <ul class="breadcrumb">
    <li><a href="../../index.html">ホーム</a></li>
    <li><a href="../../toeic/index.html">TOEIC® L&R</a></li>
    <li><a href="../../toeic/problems.html">練習問題</a></li>
    <li>リスニング ブックマーク復習</li>
  </ul>

  <!-- STEP 1: レベル選択 -->
  <div id="level-select" class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h1 style="margin:0; font-size:1.6rem; text-align:left;">
        <i class="fas fa-star" style="color:#eab308;"></i> リスニング - ブックマーク復習
      </h1>
      <a href="../../toeic/problems.html" class="btn small" style="background:#64748b; color:#fff;">問題選択へ戻る</a>
    </div>

    <p style="margin-top:10px;">演習中に保存（★）した苦手なリスニング問題を音声付きで復習します。</p>

    <div id="bookmark-summary-bar" style="background:#f8fafc; padding:14px 18px; border-radius:10px; border:1px solid #e2e8f0; margin:16px 0; font-weight:700; color:#334155;">
      読み込み中...
    </div>

    <h3 style="text-align:left; margin-top:20px;">復習するレベルを選択</h3>
    <div id="level-btn-container" class="level-badge-grid"></div>

    <div style="text-align:center; margin-top:20px;">
      <button id="all-bookmarks-btn" class="nav-btn nav-btn-primary" onclick="startQuiz('all')">
        <i class="fas fa-play"></i> 保存された全問を一括復習する
      </button>
    </div>
  </div>

  <!-- STEP 2: 問題解答 -->
  <div id="quiz-view" class="card hidden" style="position:relative;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:8px;">
      <span id="quiz-progress-text" style="font-weight:700; color:var(--listening-accent);"></span>
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="bookmark-toggle-btn" class="nav-btn nav-btn-secondary" style="padding:6px 12px; font-size:0.85rem;" onclick="toggleCurrentBookmark()">
          <i class="fas fa-star" style="color:#eab308;"></i> 解除する
        </button>
        <button type="button" class="quit-quiz-btn" onclick="showLevelSelect()">
          <i class="fas fa-arrow-left"></i> 条件を変更して選び直す
        </button>
      </div>
    </div>

    <!-- 音声再生コントロール -->
    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:16px; margin-bottom:20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
        <div class="rate-controls" style="display:flex; gap:4px;">
          <button id="rate-0.5" type="button" onclick="setSpeechRate(0.5)">0.5x</button>
          <button id="rate-0.75" type="button" onclick="setSpeechRate(0.75)">0.75x</button>
          <button id="rate-1" type="button" class="selected" onclick="setSpeechRate(1)">1x</button>
          <button id="rate-1.25" type="button" onclick="setSpeechRate(1.25)">1.25x</button>
          <button id="rate-1.5" type="button" onclick="setSpeechRate(1.5)">1.5x</button>
        </div>
        <div class="voice-controls" style="display:flex; gap:6px;">
          <button id="voice-female" type="button" onclick="selectVoice('female')" disabled><i class="fas fa-female"></i></button>
          <button id="voice-male" type="button" onclick="selectVoice('male')" disabled><i class="fas fa-male"></i></button>
        </div>
      </div>
      <div style="text-align:center;">
        <button id="speak-btn" type="button" onclick="playQuestionAudio()" style="font-size:1.5rem; width:56px; height:56px; border-radius:50%; background:var(--listening-accent); color:#fff; border:none; cursor:pointer;">
          <i class="fas fa-volume-up"></i>
        </button>
        <p style="margin:6px 0 0; font-size:0.8rem; color:#64748b;">アイコンをクリックすると音声が流れます</p>
      </div>
    </div>

    <div style="margin-bottom:15px;">
      <button id="toggle-sentence-btn" type="button" onclick="toggleSentence()" style="font-size:0.85rem; padding:6px 14px; background:#e2e8f0; color:#334155; border:none; border-radius:6px; cursor:pointer;">英文を表示</button>
      <div id="sentence-container" class="hidden" style="margin-top:10px; background:#eff6ff; border-radius:8px; padding:12px; font-size:0.95rem; color:#1e293b;">
        <p id="sentence-text" style="margin:0;"></p>
      </div>
    </div>

    <div style="font-size:1.15rem; font-weight:700; color:#1e293b; margin:16px 0 20px;">
      <p id="quiz-question-text" style="margin:0;"></p>
    </div>

    <div id="quiz-choices-container"></div>

    <div id="explanation-box" class="listen-exp-box hidden">
      <div id="explanation-title" style="font-weight:800; margin-bottom:6px;"></div>
      <div id="explanation-content" style="color:#334155; line-height:1.7;"></div>
    </div>

    <div style="margin-top:20px; text-align:right;">
      <button id="next-btn" class="nav-btn nav-btn-primary hidden" onclick="nextQuestion()">
        次の問題へ <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- STEP 3: 結果 -->
  <div id="result-view" class="card hidden" style="text-align:center; padding:35px 20px;">
    <div style="font-size:3rem; color:var(--listening-accent); margin-bottom:12px;">
      <i class="fas fa-check-circle" style="color:#10b981;"></i>
    </div>
    <h2>ブックマーク復習完了！</h2>
    <p id="result-text" style="font-size:1.2rem; margin:16px 0; font-weight:700;"></p>
    <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:20px;">
      <button class="nav-btn nav-btn-primary" onclick="showLevelSelect()">
        <i class="fas fa-arrow-left"></i> 条件を変更して選び直す
      </button>
      <a href="training.html" class="nav-btn nav-btn-secondary" style="text-decoration:none;">
        <i class="fas fa-dumbbell"></i> トレーニングへ
      </a>
      <a href="../../toeic/problems.html" class="nav-btn nav-btn-secondary" style="text-decoration:none;">
        <i class="fas fa-list"></i> 問題選択へ戻る
      </a>
    </div>
  </div>
</div>

<script>
let bookmarks = { listening: [] };
let currentQuestions = [];
let currentIdx = 0;
let score = 0;
let isAnswered = false;
let speechRate = 1;
let maleVoice = null;
let femaleVoice = null;
let selectedVoice = null;

function loadVoices() {
  const voices = window.speechSynthesis.getVoices().filter(v => v.lang === 'en-US');
  if (voices.length === 0) return;
  femaleVoice = voices.find(v => /female|zira|samantha|victoria/i.test(v.name)) || voices[0];
  maleVoice = voices.find(v => /male|david|mark|alex/i.test(v.name)) || voices.find(v => v.name !== femaleVoice.name);
  selectedVoice = femaleVoice;
  if (femaleVoice) {
    document.getElementById('voice-female').disabled = false;
    document.getElementById('voice-female').classList.add('selected');
  }
  if (maleVoice && maleVoice !== femaleVoice) {
    document.getElementById('voice-male').disabled = false;
  }
}

function setSpeechRate(rate) {
  speechRate = rate;
  document.querySelectorAll('.rate-controls button').forEach(btn => btn.classList.remove('selected'));
  document.getElementById(`rate-${rate}`).classList.add('selected');
}

function selectVoice(gender) {
  const femaleBtn = document.getElementById('voice-female');
  const maleBtn = document.getElementById('voice-male');
  if (gender === 'female' && femaleVoice) {
    selectedVoice = femaleVoice;
    femaleBtn.classList.add('selected');
    maleBtn.classList.remove('selected');
  } else if (gender === 'male' && maleVoice) {
    selectedVoice = maleVoice;
    maleBtn.classList.add('selected');
    femaleBtn.classList.remove('selected');
  }
}

function speakText(text) {
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = speechRate;
  if (selectedVoice) utterance.voice = selectedVoice;
  window.speechSynthesis.speak(utterance);
}

function playQuestionAudio() {
  const qData = currentQuestions[currentIdx];
  if (!qData) return;
  const text = (qData.sentence ? qData.sentence + ' ' : '') + qData.q;
  speakText(text);
}

function toggleSentence() {
  const container = document.getElementById('sentence-container');
  const btn = document.getElementById('toggle-sentence-btn');
  if (container.classList.contains('hidden')) {
    container.classList.remove('hidden');
    btn.textContent = '英文を隠す';
  } else {
    container.classList.add('hidden');
    btn.textContent = '英文を表示';
  }
}

function initApp() {
  try {
    const raw = localStorage.getItem('bookmarks');
    if (raw) {
      const parsed = JSON.parse(raw);
      bookmarks = parsed;
      if (!bookmarks.listening) bookmarks.listening = [];
    }
  } catch(e) {}
  showLevelSelect();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  loadVoices();
}

function showLevelSelect() {
  window.speechSynthesis.cancel();
  document.getElementById('level-select').classList.remove('hidden');
  document.getElementById('quiz-view').classList.add('hidden');
  document.getElementById('result-view').classList.add('hidden');

  const lBookmarks = bookmarks.listening || [];
  document.getElementById('bookmark-summary-bar').innerHTML = `
    保存中のリスニング問題： <strong>${lBookmarks.length}</strong> 問
  `;

  document.getElementById('all-bookmarks-btn').disabled = (lBookmarks.length === 0);

  const container = document.getElementById('level-btn-container');
  container.innerHTML = '';
  const levels = [300, 400, 500, 600, 700, 800, 900];
  levels.forEach(lv => {
    const count = lBookmarks.filter(b => b.level === lv).length;
    const btn = document.createElement('button');
    btn.className = 'level-pill-btn';
    btn.textContent = `${lv}点 (${count}問)`;
    btn.disabled = (count === 0);
    btn.onclick = () => startQuiz(lv);
    container.appendChild(btn);
  });
}

function startQuiz(target) {
  const lBookmarks = bookmarks.listening || [];
  if (target === 'all') {
    currentQuestions = [...lBookmarks];
  } else {
    currentQuestions = lBookmarks.filter(b => b.level === target);
  }
  if (currentQuestions.length === 0) {
    alert('該当するブックマークがありません。');
    return;
  }
  currentIdx = 0;
  score = 0;

  document.getElementById('level-select').classList.add('hidden');
  document.getElementById('result-view').classList.add('hidden');
  document.getElementById('quiz-view').classList.remove('hidden');

  renderQuestion();
}

function renderQuestion() {
  isAnswered = false;
  const qData = currentQuestions[currentIdx];

  document.getElementById('quiz-progress-text').textContent = 
    `問題 ${currentIdx + 1} / ${currentQuestions.length} (${qData.level || 'レベル共通'}点)`;

  document.getElementById('sentence-text').textContent = qData.sentence || '英文はありません';
  document.getElementById('sentence-container').classList.add('hidden');
  document.getElementById('toggle-sentence-btn').textContent = '英文を表示';

  document.getElementById('quiz-question-text').textContent = qData.q;

  const choicesContainer = document.getElementById('quiz-choices-container');
  choicesContainer.innerHTML = '';

  document.getElementById('explanation-box').classList.add('hidden');
  document.getElementById('next-btn').classList.add('hidden');

  const choices = [...(qData.choices || [])];
  choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'listen-choice-btn';
    btn.textContent = choice;
    btn.onclick = () => handleAnswer(choice, btn);
    choicesContainer.appendChild(btn);
  });

  playQuestionAudio();
}

function handleAnswer(choice, selectedBtn) {
  if (isAnswered) return;
  isAnswered = true;

  const qData = currentQuestions[currentIdx];
  const isCorrect = (choice === qData.answer);
  if (isCorrect) score++;

  const allBtns = document.querySelectorAll('#quiz-choices-container .listen-choice-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.textContent === qData.answer) {
      b.classList.add('correct');
      b.innerHTML = `<i class="fas fa-check-circle" style="margin-right:8px;"></i>${b.textContent}`;
    } else if (b === selectedBtn && !isCorrect) {
      b.classList.add('wrong');
      b.innerHTML = `<i class="fas fa-times-circle" style="margin-right:8px;"></i>${b.textContent}`;
    }
  });

  const expBox = document.getElementById('explanation-box');
  const expTitle = document.getElementById('explanation-title');
  const expContent = document.getElementById('explanation-content');

  expBox.classList.remove('hidden');
  if (isCorrect) {
    expTitle.innerHTML = '<i class="fas fa-check-circle" style="color:#10b981;"></i> 正解！';
  } else {
    expTitle.innerHTML = `<i class="fas fa-times-circle" style="color:#ef4444;"></i> 不正解（正解: 「${qData.answer}」）`;
  }
  expContent.innerHTML = `<strong>【解説・スクリプト】</strong><br>${qData.explanation || '解説はありません。'}`;

  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('hidden');
  nextBtn.innerHTML = (currentIdx + 1 >= currentQuestions.length)
    ? '復習結果を見る <i class="fas fa-check"></i>'
    : '次の問題へ <i class="fas fa-arrow-right"></i>';
}

function nextQuestion() {
  window.speechSynthesis.cancel();
  currentIdx++;
  if (currentIdx < currentQuestions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function toggleCurrentBookmark() {
  const qData = currentQuestions[currentIdx];
  const bList = bookmarks.listening || [];
  const idx = bList.findIndex(b => b.q === qData.q);
  if (idx !== -1) {
    bList.splice(idx, 1);
    localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
    alert('この問題をブックマークから解除しました。');
  }
}

function showResult() {
  window.speechSynthesis.cancel();
  document.getElementById('quiz-view').classList.add('hidden');
  document.getElementById('result-view').classList.remove('hidden');
  document.getElementById('result-text').textContent = 
    `${currentQuestions.length}問中、${score}問正解しました！`;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
