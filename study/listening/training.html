<style>
.level-badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
  margin: 14px 0 22px;
}
.level-pill-btn {
  background: #fff;
  border: 1.5px solid #cbd5e1;
  color: #334155;
  padding: 10px 6px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.18s ease;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60px;
  box-sizing: border-box;
}
.level-pill-btn .pill-main {
  font-weight: 800;
  font-size: 0.95rem;
  line-height: 1.25;
  white-space: nowrap;
}
.level-pill-btn .pill-sub {
  font-weight: 500;
  font-size: 0.78rem;
  color: #64748b;
  margin-top: 3px;
  line-height: 1.2;
  white-space: nowrap;
}
.level-pill-btn:hover {
  background: #f1f5f9;
  border-color: #94a3b8;
  transform: translateY(-1px);
}
.level-pill-btn.active {
  background: #345d4d;
  border-color: #345d4d;
  color: #fff;
  box-shadow: 0 3px 10px rgba(29,78,216,0.32);
}
.level-pill-btn.active .pill-sub {
  color: rgba(255, 255, 255, 0.92);
}
.start-train-btn {
  font-size: 1.05rem;
  padding: 12px 36px;
  background: #345d4d;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(29,78,216,0.3);
  transition: all 0.2s ease;
}
.start-train-btn:hover {
  background: #1e40af;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(29,78,216,0.4);
}

#level-select.card {
  max-width: 780px;
  margin: 20px auto;
}
#quiz.single-quiz-card {
  max-width: 760px;
  margin: 20px auto;
  padding: 30px 28px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
  border: 1.5px solid #e2e8f0;
  border-radius: 16px;
  background: #ffffff;
}
#result.card {
  max-width: 760px;
  margin: 20px auto;
}

<body>
  <!-- ヘッダー（共通：トップのみ） -->
    <!-- ヘッダー（資格ページ共通：右側トップへ戻るのみ） -->
  <header class="kakutoku-header">
    <div class="header-inner">
      <a href="../../index.html" class="logo-link">
        <div class="logo-mark">S</div>
        <span class="logo-text">Shikakus</span>
      </a>

      <div class="header-actions">

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N3ZFKBQ3"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="container">
        <div id="level-select" class="card">
            <div style="text-align:center; margin-bottom:20px;">
                <span style="background:#eff6ff; color:#345d4d; font-size:0.85rem; font-weight:700; padding:4px 12px; border-radius:20px; display:inline-block; margin-bottom:8px;">Listening</span>
                <h2 style="margin:0 0 6px;">リスニングトレーニング</h2>
                <p style="margin:0; font-size:0.92rem; color:#64748b;">目標スコアレベルと出題数を選択して演習をスタートします。</p>
            </div>

            <h3 style="text-align:left; margin-top:16px; font-size:1.1rem; color:#1e293b;">1. 目標スコアレベルを選択</h3>
            <div id="level-container" class="level-badge-grid"></div>

            <h3 style="text-align:left; margin-top:16px; font-size:1.1rem; color:#1e293b;">2. 出題数を選択</h3>
            <div id="count-container" class="level-badge-grid"></div>

            <div style="text-align:center; margin-top:25px;">
                <button type="button" class="start-train-btn" onclick="startListeningSession()">
                    <i class="fas fa-play"></i> この設定でトレーニングを開始する
                </button>
            </div>
            <div style="text-align:center; margin-top:20px;">
                <a href="../../toeic/problems.html" style="color:#475569; background:#f1f5f9; border:1px solid #cbd5e1; padding:8px 18px; border-radius:8px; font-size:0.92rem; text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:6px; transition:all 0.2s ease;">
                    <i class="fas fa-arrow-left"></i> 学習分野を選択し直す
                </a>
            </div>
        </div>
        <div id="question-count-select" class="hidden"></div>
        <div id="quiz" class="card single-quiz-card hidden" style="position: relative;">
            <button type="button" class="quit-quiz-btn" onclick="showLevelSelect()"><i class="fas fa-arrow-left"></i> 条件を変更して選び直す</button>
            <span id="bookmark" class="bookmark" onclick="toggleBookmark()">☆</span>
            <h2 id="quiz-title" style="margin-top: 10px;"></h2>
            <div class="question-header">
                <div class="speech-controls-container">
                    <div class="rate-controls">
                        <button id="rate-0.5" onclick="setSpeechRate(0.5)">0.5x</button>
                        <button id="rate-0.75" onclick="setSpeechRate(0.75)">0.75x</button>
                        <button id="rate-1" class="selected" onclick="setSpeechRate(1)">1x</button>
                        <button id="rate-1.25" onclick="setSpeechRate(1.25)">1.25x</button>
                        <button id="rate-1.5" onclick="setSpeechRate(1.5)">1.5x</button>
                    </div>
                    <div class="voice-controls">
                        <button id="voice-female" onclick="selectVoice('female')" disabled><i class="fas fa-female"></i></button>
                        <button id="voice-male" onclick="selectVoice('male')" disabled><i class="fas fa-male"></i></button>
                    </div>
                </div>
                <button id="speak-btn"><i class="fas fa-volume-up"></i></button>
                <p class="speak-note">アイコンをクリックすると音声が流れます</p>
            </div>
            <div class="q-section">
                <p class="q-label">【文章】</p>
                <button id="toggle-sentence-btn" onclick="toggleSentence()">英文を表示</button>
                <div id="sentence-container" class="hidden">
                    <p id="sentence-text"></p>
                </div>
            </div>
            <div class="q-section">
                <p class="q-label">【質問】</p>
                <div id="question" style="font-size: 1.15rem; font-weight: bold; margin: 10px 0 20px; line-height: 1.6; color: #2d3748;"></div>
            </div>
            <div id="choices" class="quiz-options"></div>
            <div id="explanation-area" class="quiz-explanation-area">
                <div id="explanation-title" class="quiz-result-title"></div>
                <div id="explanation-body" style="line-height: 1.7; margin: 12px 0;"></div>
                <div class="next-question-bar">
                    <button id="next-btn" type="button" class="next-question-btn" onclick="nextQuestion()">
                        次の問題へ <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
        <div id="result" class="card hidden" style="text-align:center;">
             <h2>トレーニング完了！</h2>
             <p id="result-text" style="font-size: 1.2rem; margin: 20px 0;"></p>
                          <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top:20px;">
                  <button type="button" class="icon-button" onclick="showLevelSelect()" style="background: #345d4d; color: white; border:none; padding:10px 20px; border-radius:8px; font-weight:700; cursor:pointer;"><i class="fas fa-arrow-left"></i> 条件を変更して選び直す</button>
                  <a href="../../toeic/problems.html" style="text-decoration:none;"><button type="button" class="icon-button" style="background: #64748b; color: white; border:none; padding:10px 20px; border-radius:8px; font-weight:700; cursor:pointer;"><i class="fas fa-list"></i> 学習分野を選択し直す</button></a>
              </div>
        </div>
    </div>
    <script> const quizData = { vocabulary: {}, writing: {}, listening: {} }; </script>
    <script src="../../assets/js/data/quizData_listening_300.js"></script>
    <script src="../../assets/js/data/quizData_listening_400.js"></script>
    <script src="../../assets/js/data/quizData_listening_500.js"></script>
    <script src="../../assets/js/data/quizData_listening_600.js"></script>
    <script src="../../assets/js/data/quizData_listening_700.js"></script>
    <script src="../../assets/js/data/quizData_listening_800.js"></script>
    <script src="../../assets/js/data/quizData_listening_900.js"></script>
    <script>
        const currentCategory = 'listening';
        const currentMode = 'training';
        let currentLevel, currentQuestions, currentQuestion, score, bookmarks;
        let speechRate = 1;
        let maleVoice = null;
        let femaleVoice = null;
        let selectedVoice = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices().filter(v => v.lang === 'en-US');
            if (voices.length === 0) return;
            femaleVoice = voices.find(v => /female|zira|samantha|victoria/i.test(v.name)) || voices[0];
            maleVoice = voices.find(v => /male|david|mark|alex/i.test(v.name)) || voices.find(v => v.name !== femaleVoice.name);
            selectedVoice = femaleVoice;
            if (femaleVoice) {
                document.getElementById('voice-female').disabled = false;
                document.getElementById('voice-female').classList.add('selected');
            }
            if (maleVoice && maleVoice !== femaleVoice) {
                document.getElementById('voice-male').disabled = false;
            }
        }
        function setSpeechRate(rate) {
            speechRate = rate;
            document.querySelectorAll('.rate-controls button').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`rate-${rate}`).classList.add('selected');
        }
        function selectVoice(gender) {
            const femaleBtn = document.getElementById('voice-female');
            const maleBtn = document.getElementById('voice-male');
            if (gender === 'female' && femaleVoice) {
                selectedVoice = femaleVoice;
                femaleBtn.classList.add('selected');
                maleBtn.classList.remove('selected');
            } else if (gender === 'male' && maleVoice) {
                selectedVoice = maleVoice;
                maleBtn.classList.add('selected');
                femaleBtn.classList.remove('selected');
            }
        }
        let selectedCount = 10;
        currentLevel = 600;

        const availableLevels = [
            { lv: 300, main: '300点レベル', sub: '（超入門）' },
            { lv: 400, main: '400点レベル', sub: '（入門）' },
            { lv: 500, main: '500点レベル', sub: '（基礎）' },
            { lv: 600, main: '600点レベル', sub: '（標準）' },
            { lv: 700, main: '700点レベル', sub: '（中上級）' },
            { lv: 800, main: '800点レベル', sub: '（上級）' },
            { lv: 900, main: '900点レベル', sub: '（難関）' }
        ];

        const countOptions = [
            { val: 5, main: '5問', sub: '（ミニ特訓）' },
            { val: 10, main: '10問', sub: '（標準）' },
            { val: 15, main: '15問', sub: '（全問制覇）' }
        ];

        function renderLevelButtons() {
            const container = document.getElementById('level-container');
            if (!container) return;
            container.innerHTML = '';
            availableLevels.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `level-pill-btn ${item.lv === currentLevel ? 'active' : ''}`;
                btn.innerHTML = `<span class="pill-main">${item.main}</span><span class="pill-sub">${item.sub}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('#level-container .level-pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLevel = item.lv;
                };
                container.appendChild(btn);
            });
        }

        function renderCountButtons() {
            const container = document.getElementById('count-container');
            if (!container) return;
            container.innerHTML = '';
            countOptions.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `level-pill-btn ${item.val === selectedCount ? 'active' : ''}`;
                btn.innerHTML = `<span class="pill-main">${item.main}</span><span class="pill-sub">${item.sub}</span>`;
                btn.onclick = () => {
                    document.querySelectorAll('#count-container .level-pill-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedCount = item.val;
                };
                container.appendChild(btn);
            });
        }

        function startListeningSession() {
            if (!quizData[currentCategory][currentLevel] || quizData[currentCategory][currentLevel].length === 0) {
                alert(`レベル${currentLevel}点のリスニング問題データが見つかりません。`);
                return;
            }
            startQuiz(selectedCount);
        }

        function initializeApp() {
            bookmarks = JSON.parse(localStorage.getItem('bookmarks')) || { vocabulary: [], writing: [], reading: [], listening: [] };
            renderLevelButtons();
            renderCountButtons();
            showLevelSelect();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }
            loadVoices();
        }
        function getCategoryName(category) { return { vocabulary: '単語', reading: 'リーディング', writing: 'リーディング', listening: 'リスニング' }[category] || ''; }
        function getModeName(mode) { return { test: 'テスト', training: 'トレーニング' }[mode] || ''; }
        function hideAllSections() { ["level-select", "question-count-select", "quiz", "result"].forEach(id => { const el = document.getElementById(id); if (el) el.classList.add("hidden"); }); }
        function showLevelSelect() { 
            hideAllSections(); 
            document.getElementById("level-select").classList.remove("hidden"); 
            window.speechSynthesis.cancel();
        }
        function selectLevel(level) {
            currentLevel = level;
            startListeningSession();
        }
        function startQuiz(questionCount) {
            currentQuestion = 0;
            score = 0;
            const allQuestions = [...quizData[currentCategory][currentLevel]];
            currentQuestions = shuffleArray(allQuestions).slice(0, questionCount);
            hideAllSections();
            document.getElementById("quiz").classList.remove("hidden");
            showQuestion();
        }
        function startQuizAll() { startQuiz(quizData[currentCategory][currentLevel].length); }
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        function speakText(text) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = speechRate;
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            window.speechSynthesis.speak(utterance);
        }
        function toggleSentence() {
            const sentenceContainer = document.getElementById('sentence-container');
            const toggleBtn = document.getElementById('toggle-sentence-btn');
            sentenceContainer.classList.toggle('hidden');
            toggleBtn.textContent = sentenceContainer.classList.contains('hidden') ? '英文を表示' : '英文を非表示';
        }
        function showQuestion() {
            const expArea = document.getElementById("explanation-area");
            expArea.style.display = "none";
            expArea.className = "quiz-explanation-area";

            document.getElementById('sentence-container').classList.add('hidden');
            document.getElementById('toggle-sentence-btn').textContent = '英文を表示';
            const qData = currentQuestions[currentQuestion];
            document.getElementById("quiz-title").textContent = `問題 ${currentQuestion + 1} / ${currentQuestions.length}`;
            document.getElementById("question").textContent = qData.q;
            document.getElementById("sentence-text").textContent = qData.sentence;
            document.getElementById('speak-btn').onclick = () => speakText(qData.sentence);
            const choicesDiv = document.getElementById("choices");
            choicesDiv.innerHTML = "";

            let answered = false;
            shuffleArray(qData.choices).forEach(choice => {
                const opt = document.createElement("div");
                opt.className = "quiz-option";
                opt.textContent = choice;
                opt.onclick = () => {
                    if (answered) return;
                    answered = true;
                    checkAnswer(choice, opt);
                };
                choicesDiv.appendChild(opt);
            });
            updateBookmarkStatus();
        }
        function checkAnswer(choice, selectedOpt) {
            window.speechSynthesis.cancel();
            const qData = currentQuestions[currentQuestion];
            const isCorrect = choice === qData.answer;
            if(isCorrect) score++;
            updateStatistics(currentCategory, currentLevel, isCorrect, qData.q);

            const allOpts = document.querySelectorAll('#choices .quiz-option');
            allOpts.forEach(opt => {
                opt.classList.add("locked");
                if (opt.textContent === qData.answer) {
                    opt.classList.add("correct-choice");
                    opt.innerHTML = `${opt.textContent} <i class="fas fa-check-circle" style="float: right; margin-top: 3px;"></i>`;
                } else if (opt === selectedOpt && !isCorrect) {
                    opt.classList.add("wrong-choice");
                    opt.innerHTML = `${opt.textContent} <i class="fas fa-times-circle" style="float: right; margin-top: 3px;"></i>`;
                }
            });

            const expArea = document.getElementById("explanation-area");
            const expTitle = document.getElementById("explanation-title");
            const expBody = document.getElementById("explanation-body");
            const nextBtn = document.getElementById("next-btn");

            expArea.classList.remove("is-correct", "is-wrong");
            if (isCorrect) {
                expArea.classList.add("is-correct");
                expTitle.innerHTML = `<i class="fas fa-check-circle"></i> 正解です！`;
            } else {
                expArea.classList.add("is-wrong");
                expTitle.innerHTML = `<i class="fas fa-times-circle"></i> 不正解... 正解は「${qData.answer}」です`;
            }

            expBody.innerHTML = `
                <div style="margin-bottom: 8px;"><strong>【解説】</strong></div>
                <div style="margin-bottom: 12px;">${qData.explanation}</div>
                <div style="margin-bottom: 8px;"><strong>【英文・和訳】</strong></div>
                <div style="font-size: 0.95rem; color: #2d3748; margin-bottom: 6px; font-weight: 500;">${qData.sentence}</div>
                <div style="color: #4a5568;">${qData.translation}</div>
            `;

            if (currentQuestion + 1 >= currentQuestions.length) {
                nextBtn.innerHTML = `結果を見る <i class="fas fa-check-circle"></i>`;
            } else {
                nextBtn.innerHTML = `次の問題へ <i class="fas fa-arrow-right"></i>`;
            }

            expArea.style.display = "block";
            expArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < currentQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }
        function showResult() {
            hideAllSections();
            const resultDiv = document.getElementById("result");
            resultDiv.classList.remove("hidden");
            document.getElementById("result-text").textContent = `${currentQuestions.length}問中、${score}問正解しました。`;
        }
        function updateBookmarkStatus() {
            const qData = currentQuestions[currentQuestion];
            const isBookmarked = bookmarks[currentCategory].some(b => b.q === qData.q);
            const bookmarkEl = document.getElementById("bookmark");
            bookmarkEl.textContent = isBookmarked ? "★" : "☆";
            bookmarkEl.className = isBookmarked ? "bookmark bookmarked" : "bookmark";
        }
        function toggleBookmark() {
            const qData = currentQuestions[currentQuestion];
            const bookmarkIndex = bookmarks[currentCategory].findIndex(b => b.q === qData.q);
            if (bookmarkIndex === -1) {
                bookmarks[currentCategory].push({ ...qData, level: currentLevel, category: currentCategory });
            } else {
                bookmarks[currentCategory].splice(bookmarkIndex, 1);
            }
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            updateBookmarkStatus();
        }
        function updateStatistics(category, level, isCorrect, question) {
            if (currentMode !== 'test') {
                return;
            }
            let statistics = JSON.parse(localStorage.getItem('statistics')) || {};
            let mistakes = JSON.parse(localStorage.getItem('mistakes')) || {};
            const key = `${category}_${level}`;
            if (!statistics[key]) statistics[key] = { total: 0, correct: 0, category, level };
            statistics[key].total++;
            if (isCorrect) {
                statistics[key].correct++;
            } else {
                if (!mistakes[key]) mistakes[key] = {};
                mistakes[key][question] = (mistakes[key][question] || 0) + 1;
            }
            localStorage.setItem('statistics', JSON.stringify(statistics));
            localStorage.setItem('mistakes', JSON.stringify(mistakes));
        }
        // DOM構築完了時に即時実行（AdSense等の外部通信待機による遅延を防止）
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeApp);
} else {
    initializeApp();
}
    </script>
